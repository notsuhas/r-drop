name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: lint
        run: bunx biome check .

      - name: typecheck
        run: |
          (cd apps/api && bunx tsc --noEmit -p .)
          (cd apps/dashboard && bunx tsc -b)

      - name: unit tests
        run: |
          (cd apps/api && bun test)
          (cd apps/dashboard && bun test)

      - name: integration tests (workers pool)
        run: cd apps/api && bunx vitest run

      - name: build dashboard
        run: cd apps/dashboard && bun run build

      - name: codebase intelligence
        run: bunx fallow

  deploy:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The instance config is gitignored; CI gets it from a repo secret.
      - name: materialize wrangler.jsonc
        run: printf '%s' "$WRANGLER_CONFIG" > wrangler.jsonc
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}

      - name: build dashboard
        run: cd apps/dashboard && bun run build

      - name: deploy worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
