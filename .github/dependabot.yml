# Dependency updates. Minor/patch bumps arrive as one grouped PR so a routine
# week is one CI run to review; majors stay individual, since those are the
# ones that need a human to read a changelog.
version: 2
updates:
  # Bun workspace: the root lockfile covers apps/api and apps/dashboard.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
